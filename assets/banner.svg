<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0e1630"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.55" stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d33"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#173a5e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#173a5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <ellipse cx="320" cy="200" rx="520" ry="320" fill="url(#glow)"/>

  <!-- faint scanlines -->
  <g stroke="#16203c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="110" x2="1280" y2="110"/>
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="330" x2="1280" y2="330"/>
  </g>

  <!-- ───────────────────────── Left: branding ───────────────────────── -->
  <g transform="translate(72,150)">
    <text x="0" y="0" font-size="78" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#title)">MISA</tspan><tspan fill="#e6edf3"> LSP</tspan>
    </text>
    <text x="2" y="46" font-size="22" fill="#9fb0d0">Language server for the</text>
    <text x="2" y="76" font-size="22" fill="#9fb0d0"><tspan fill="#7ee787">Mnemonimov</tspan> fantasy console.</text>

    <!-- pills -->
    <g transform="translate(2,118)" font-size="15" font-weight="600">
      <g>
        <rect x="0" y="0" width="92" height="30" rx="15" fill="#15203c" stroke="#2b3a63"/>
        <text x="46" y="20" fill="#9bd0ff" text-anchor="middle">C++20</text>
      </g>
      <g transform="translate(104,0)">
        <rect x="0" y="0" width="118" height="30" rx="15" fill="#15203c" stroke="#2b3a63"/>
        <text x="59" y="20" fill="#9bffb6" text-anchor="middle">LSP 3.17</text>
      </g>
      <g transform="translate(234,0)">
        <rect x="0" y="0" width="160" height="30" rx="15" fill="#15203c" stroke="#2b3a63"/>
        <text x="80" y="20" fill="#d9c6ff" text-anchor="middle">JSON-RPC · stdio</text>
      </g>
    </g>
  </g>

  <!-- ───────────────────────── Right: editor mock ───────────────────────── -->
  <g transform="translate(516,54)" filter="url(#soft)">
    <rect x="0" y="0" width="700" height="332" rx="14" fill="url(#glass)" stroke="#26324f"/>
    <!-- title bar -->
    <path d="M0 14 A14 14 0 0 1 14 0 H686 A14 14 0 0 1 700 14 V44 H0 Z" fill="#121a30"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="22" r="6" fill="#27c93f"/>
    <text x="350" y="27" font-size="14" fill="#6f7fa6" text-anchor="middle">player.mnemo</text>

    <!-- code -->
    <g font-size="19">
      <!-- gutter -->
      <g fill="#41507a" text-anchor="end">
        <text x="52" y="86">1</text>
        <text x="52" y="116">2</text>
        <text x="52" y="146">3</text>
        <text x="52" y="176">4</text>
        <text x="52" y="206">5</text>
        <text x="52" y="236">6</text>
        <text x="52" y="266">7</text>
      </g>

      <!-- lines -->
      <text x="72" y="86"><tspan fill="#7ee787">_draw</tspan><tspan fill="#8b949e">:</tspan></text>
      <text x="72" y="116"><tspan fill="#ff7b72">  syscall </tspan><tspan fill="#d2a8ff">SYS_DRAW_RECT</tspan></text>
      <text x="72" y="146"><tspan fill="#ff7b72">  lod </tspan><tspan fill="#ffa657">u8t</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">a0</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#e6edf3">sprite</tspan></text>
      <text x="72" y="176"><tspan fill="#ff7b72">  add </tspan><tspan fill="#79c0ff">t0</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#f2cc60">1</tspan></text>
      <text x="72" y="206"><tspan fill="#ff7b72">  cmp </tspan><tspan fill="#56d4dd">eq</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">t0</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#f2cc60">16</tspan></text>
      <text x="72" y="236"><tspan fill="#ff7b72">  jtr </tspan><tspan fill="#7ee787">.reset</tspan></text>
      <text x="72" y="266"><tspan fill="#ff7b72">  exit</tspan></text>
    </g>

    <!-- hover card over `cmp` -->
    <g transform="translate(300,182)">
      <rect x="0" y="0" width="372" height="118" rx="10" fill="#0d1426" stroke="#30406b"/>
      <text x="16" y="30" font-size="16"><tspan fill="#e6edf3" font-weight="700">cmp</tspan><tspan fill="#6f7fa6"> — Compare</tspan></text>
      <text x="16" y="54" font-size="13" fill="#8b949e">Logic / Bitwise · sets the cr register</text>
      <line x1="16" y1="68" x2="356" y2="68" stroke="#222d4d"/>
      <text x="16" y="94" font-size="14"><tspan fill="#9bd0ff">cr = (a </tspan><tspan fill="#56d4dd">eq</tspan><tspan fill="#9bd0ff"> b) ? 1 : 0</tspan></text>
    </g>
  </g>
</svg>
